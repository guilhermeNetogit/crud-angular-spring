<div class="tabela-container-produtos">
  @if (produtos$ | async; as dadosPagina) {
    @if (loadingError()) {
      <div class="error-state" style="text-align: center; padding: 2rem;">
        <mat-icon color="warn">cloud_off</mat-icon>
        <p>O servidor parece estar offline. Tente novamente mais tarde.</p>
        <button mat-raised-button color="primary" (click)="refresh()">Tentar Novamente</button>
      </div>
    } @else {
      <!-- 💡 ESSA DIV INTERNA É O SEGREDO: Ela vai abraçar o filho e o paginador -->
      <div class="tabela-wrapper">
        <app-produtos-list
          [dataSource]="dataSource"
          [filterValue]="filterValue"
          (add)="onAdd()"
          (edit)="onEdit($event)"
          (delete)="onDelete($event)"
          (filter)="applyFilter($event)"
          (clear)="clearFilter()">
        </app-produtos-list>

        @if (dadosPagina.produtos && dadosPagina.produtos.length > 0) {
          <mat-paginator
            [pageSizeOptions]="[5, 10, 25, 50]"
            [pageIndex]="pageIndex"
            [pageSize]="pageSize"
            [length]="dadosPagina.totalProdutos"
            (page)="onPageChange($event)"
            showFirstLastButtons
            aria-label="Selecione a página de produtos">
          </mat-paginator>
        }
      </div>
    }
  } @else {
    @if (!loadingError()) {
      <div class="load-spinner" style="display: flex; justify-content: center; padding: 3rem;">
        <mat-spinner></mat-spinner>
      </div>
    }
  }
</div>
