<mat-toolbar color="primary">Produtos</mat-toolbar>

<mat-form-field>
  <mat-label>Filter</mat-label>
  <input
    matInput
    (keyup)="applyFilter($event)"
    placeholder="Ex. ium"
    [value]="filterValue"
    #input>
</mat-form-field>

<table mat-table [dataSource]="dataSource" matSort class="mat-elevation-z8">

  <!-- Coluna Código -->
  <ng-container matColumnDef="codprod">
    <th mat-header-cell *matHeaderCellDef mat-sort-header> Cód. </th>
    <td mat-cell *matCellDef="let prod"> {{ prod.codprod }} </td>
  </ng-container>

  <!-- Coluna Descrição -->
  <ng-container matColumnDef="descrprod">
    <th mat-header-cell *matHeaderCellDef mat-sort-header> Descrição </th>
    <td mat-cell *matCellDef="let prod"> {{ prod.descrprod }} </td>
  </ng-container>

  <!-- Coluna Complemento -->
  <ng-container matColumnDef="compldesc">
    <th mat-header-cell *matHeaderCellDef mat-sort-header> Complemento </th>
    <td mat-cell *matCellDef="let prod"> {{ prod.compldesc }} </td>
  </ng-container>

  <!-- Coluna Volume -->
  <ng-container matColumnDef="codvol">
    <th mat-header-cell *matHeaderCellDef mat-sort-header> Vol. </th>
    <td mat-cell *matCellDef="let prod"> {{ prod.codvol }} </td>
  </ng-container>

  <!-- Coluna Referência -->
  <ng-container matColumnDef="referencia">
    <th mat-header-cell *matHeaderCellDef mat-sort-header> Referência </th>
    <td mat-cell *matCellDef="let prod"> {{ prod.referencia || '-' }} </td>
  </ng-container>

  <!-- Coluna Cód. Barras -->
  <ng-container matColumnDef="eangtin">
    <th mat-header-cell *matHeaderCellDef mat-sort-header> Cód. Barras </th>
    <td mat-cell *matCellDef="let prod"> {{ prod.eangtin || '-' }} </td>
  </ng-container>

  <!-- Actions Column -->
  <ng-container matColumnDef="actions">
    <th mat-header-cell *matHeaderCellDef>
      <button mat-icon-button [matMenuTriggerFor]="menuGlobal" class="btn-actions-menu">
        <mat-icon>more_vert</mat-icon>
      </button>

      <mat-menu #menuGlobal="matMenu">
        <button mat-menu-item (click)="onAdd()">
          <mat-icon color="primary">add</mat-icon>
          <span>Inserir Novo</span>
        </button>
      </mat-menu>
    </th>

    <td mat-cell *matCellDef="let prod">
      <button mat-icon-button [matMenuTriggerFor]="menuIndividual" class="btn-actions-menu">
        <mat-icon>more_vert</mat-icon>
      </button>
      <mat-menu #menuIndividual="matMenu">
        <button mat-menu-item (click)="onEdit(prod)">
          <mat-icon color="accent">edit</mat-icon>
          <span>Editar Item</span>
        </button>
        <button mat-menu-item (click)="onSoftDelete(prod)">
          <mat-icon color="accent">visibility_off</mat-icon>
          <span>Inativar Item</span>
        </button>
        <button mat-menu-item (click)="onDelete(prod)">
          <mat-icon color="warn">delete_forever</mat-icon>
          <span>Deletar Item</span>
        </button>
      </mat-menu>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

  <tr class="mat-row" *matNoDataRow>
    <td class="mat-cell" [attr.colspan]="displayedColumns.length" style="text-align: center; padding: 1.5rem;">
      No data matching the filter "{{filterValue}}"
    </td>
  </tr>
</table>
